[project]
name = "sqc"
version = "0.1.0"
description = "AI Security Questionnaire Copilot - evidence-grounded answering engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30",
  "pydantic>=2.9", "pydantic-settings>=2.5",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3",
  "pdfplumber>=0.11", "pypdf>=5.0", "python-docx>=1.1",
  "numpy>=2.0", "httpx>=0.27",
]

[project.optional-dependencies]
# reportlab generates the PDFs and DOCX-adjacent fixtures in tests/fixtures.py.
# Without it, test_chunking, test_ingestion_pipeline and test_parsers cannot be
# collected at all, so a clean `pip install -e ".[dev]"` could not run the suite.
dev = ["pytest>=8.0", "ruff>=0.6", "reportlab>=4.0"]
providers = ["anthropic>=0.40", "voyageai>=0.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
